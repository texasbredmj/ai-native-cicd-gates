name: AI task completion quality gates
description: Required deterministic tests, security snapshots, container validation and benchmark gates
inputs:
  target-path:
    description: Candidate directory relative to the checked-out workspace
    required: true
  output-path:
    description: New evidence directory outside the candidate
    default: .gates/action
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GATE_SOURCE: ${{ github.action_path }}
      run: python -m pip install -r "$GATE_SOURCE/requirements.lock" "$GATE_SOURCE"
    - shell: bash
      env:
        GATE_SOURCE: ${{ github.action_path }}
        GATE_TARGET: ${{ inputs.target-path }}
        GATE_OUTPUT: ${{ inputs.output-path }}
      run: python "$GATE_SOURCE/scripts/action_entry.py"
