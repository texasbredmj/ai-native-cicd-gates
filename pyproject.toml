[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "ai-native-cicd-gates"
version = "0.1.0"
description = "Reusable deterministic AI quality gates with security receipts and observable regression checks"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "opentelemetry-sdk>=1.30,<2", "packaging>=24,<27"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pip-audit>=2.9,<3"]
[project.scripts]
ai-gates = "quality_gates.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
quality_gates = ["policy.json", "gitleaks.toml", "empty-ignore"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["containers: requires Docker and the pinned Gitleaks image"]
[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
