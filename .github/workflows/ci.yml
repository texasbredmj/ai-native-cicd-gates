name: deterministic-quality-gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  policy-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock .
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q -m 'not containers'
  required-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GATES_CONTAINERS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./
        with:
          target-path: examples/application
          output-path: .gates/action
      - run: python -m pytest -q --junitxml=.gates/tests.xml
      - run: python scripts/demo.py
      - name: Gate-tool dependency snapshot
        run: python scripts/check_tool_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-gate-evidence
          path: .gates/
          include-hidden-files: true
          retention-days: 14
